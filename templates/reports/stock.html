{% extends 'base.html' %}
{% block content %}
<h4 class="fw-bold mb-4">📊 Отчёт: Остатки на складе</h4>
<div class="card">
    <table class="table mb-0">
        <thead class="table-light">
            <tr><th>Товар</th><th>Склад</th><th>Остаток</th><th>Ед.изм</th></tr>
        </thead>
        <tbody>
        {% for s in stock %}
        <tr>
            <td>{{ s.product.name }}</td>
            <td>{{ s.warehouse.name }}</td>
            <td>{{ s.quantity }}</td>
            <td>{{ s.product.unit|default:"—" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-center text-muted">Нет данных</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
