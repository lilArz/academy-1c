{% extends 'base.html' %}
{% block content %}
<h4 class="fw-bold mb-4">📈 Отчёт: Продажи</h4>
<div class="card">
    <table class="table mb-0">
        <thead class="table-light">
            <tr><th>Номер</th><th>Дата</th><th>Покупатель</th><th>Склад</th><th>Сумма</th></tr>
        </thead>
        <tbody>
        {% for s in sales %}
        <tr>
            <td>{{ s.number }}</td>
            <td>{{ s.date }}</td>
            <td>{{ s.partner }}</td>
            <td>{{ s.warehouse }}</td>
            <td>{{ s.get_total }} сом</td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="text-center text-muted">Нет данных</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
