{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h4>🧾 {{ title }}</h4>
    <a href="{% url 'documents:invoice_list' %}" class="btn btn-outline-secondary btn-sm">← Назад</a>
</div>
<div class="card p-4" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger" style="font-size:12px;">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-1"></i> Сохранить
            </button>
            <a href="{% url 'documents:invoice_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
