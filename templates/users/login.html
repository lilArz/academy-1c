<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — 1С Академия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .logo-box {
            width: 48px; height: 48px;
            background: #4f46e5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            margin: 0 auto 16px;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .btn-login {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #4338ca; }
        label { font-size: 13px; font-weight: 500; color: #374151; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo-box">1С</div>
    <h5 class="text-center fw-bold mb-1">1С Академия</h5>
    <p class="text-center text-muted mb-4" style="font-size:13px;">Торговая система</p>

    {% if error %}
    <div class="alert alert-danger py-2" style="font-size:13px;border-radius:8px;">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label>Логин</label>
            <input type="text" name="username" class="form-control mt-1" placeholder="Введите логин" required autofocus>
        </div>
        <div class="mb-4">
            <label>Пароль</label>
            <input type="password" name="password" class="form-control mt-1" placeholder="Введите пароль" required>
        </div>
        <button type="submit" class="btn-login">Войти →</button>
    </form>
</div>
</body>
</html>
