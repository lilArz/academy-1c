{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">🏭 Склады</h4>
    <a href="/admin/references/warehouse/add/" class="btn btn-primary btn-sm">+ Добавить</a>
</div>
<div class="card">
    <table class="table table-hover mb-0">
        <thead class="table-light">
            <tr><th>Название</th><th>Адрес</th><th>Статус</th></tr>
        </thead>
        <tbody>
        {% for w in warehouses %}
        <tr>
            <td>{{ w.name }}</td>
            <td>{{ w.address|default:"—" }}</td>
            <td><span class="badge bg-success">Активен</span></td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted">Складов нет</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
