{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h4>{{ title }}</h4>
    <a href="{% url 'references:product_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Назад
    </a>
</div>

<div class="card p-4" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" style="font-size:13px;font-weight:500;">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger" style="font-size:12px;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-1"></i> Сохранить
            </button>
            <a href="{% url 'references:product_list' %}" class="btn btn-outline-secondary px-4">
                Отмена
            </a>
        </div>
    </form>
</div>

{% endblock %}
