services:
  - type: web
    name: academy-1c
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: academy-1c-db
          property: connectionString

databases:
  - name: academy-1c-db
    databaseName: academy1c
    user: academy1c